<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Multiplayer Metaverse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: #000; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Lobby Screen */
        #lobby {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); border: 2px solid #6366f1; border-radius: 12px;
            padding: 20px; color: white; width: 90%; max-width: 340px; pointer-events: auto; z-index: 100;
        }
        #lobby h2 { text-align: center; color: #a5b4fc; font-size: 18px; margin-bottom: 12px; }
        .inp { width: 100%; padding: 8px 10px; margin: 6px 0 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
        .btn { width: 100%; padding: 10px; background: #4f46e5; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }

        /* Top HUD */
        #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; }
        .card { background: rgba(0,0,0,0.65); backdrop-filter: blur(6px); padding: 8px 12px; border-radius: 8px; color: white; font-size: 11px; border: 1px solid rgba(255,255,255,0.1); }

        /* Interaction Banner */
        #action-banner {
            position: absolute; top: 65%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); border: 1px solid #f59e0b; color: #f59e0b;
            padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; display: none; pointer-events: auto;
        }

        /* Chat System */
        #chat-wrap {
            position: absolute; bottom: 15px; left: 15px; width: 260px;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); pointer-events: auto;
        }
        #chat-logs { height: 100px; overflow-y: auto; padding: 8px; font-size: 11px; color: #f1f5f9; }
        #chat-form { display: flex; border-top: 1px solid #334155; }
        #chat-msg { flex: 1; padding: 6px 8px; background: transparent; border: none; color: white; font-size: 11px; outline: none; }
        #chat-btn { padding: 6px 12px; background: #4f46e5; border: none; color: white; cursor: pointer; font-size: 11px; }

        /* Mobile Action Buttons */
        #mobile-controls {
            position: absolute; bottom: 20px; right: 15px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto;
        }
        .act-btn {
            background: rgba(30, 41, 59, 0.85); border: 1px solid #6366f1; color: white;
            padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui">
        <div id="hud">
            <div class="card">
                <b>My ID:</b> <span id="my-id" style="color:#38bdf8;">Generating...</span><br>
                <b>Room:</b> <span id="room-status" style="color:#4ade80;">Single Player</span>
            </div>
            <div class="card">
                <button id="voice-btn" style="background:#ef4444; border:none; color:white; padding:4px 8px; border-radius:4px; font-weight:bold; cursor:pointer;">🎤 Mic Off</button>
            </div>
        </div>

        <div id="action-banner">Close to Player! Tap Action Below</div>

        <div id="chat-wrap">
            <div id="chat-logs"><div style="color:#94a3b8;">Welcome! Share your ID to play together.</div></div>
            <div id="chat-form">
                <input id="chat-msg" type="text" placeholder="Type msg..." />
                <button id="chat-btn">Send</button>
            </div>
        </div>

        <div id="mobile-controls">
            <button class="act-btn" id="btn-hand">🤝 Hand Hold</button>
            <button class="act-btn" id="btn-kiss">💋 Kiss</button>
            <button class="act-btn" id="btn-car">🚗 Drive / Exit</button>
        </div>
    </div>

    <div id="lobby">
        <h2>Metaverse Setup</h2>
        <label style="font-size:11px; color:#94a3b8;">Choose Shirt Color:</label>
        <select id="char-color" class="inp">
            <option value="#3b82f6">Ocean Blue</option>
            <option value="#ef4444">Ruby Red</option>
            <option value="#10b981">Emerald Green</option>
            <option value="#f59e0b">Amber Gold</option>
        </select>
        <label style="font-size:11px; color:#94a3b8;">Partner's ID (Leave empty to Host):</label>
        <input id="partner-id" class="inp" type="text" placeholder="Paste ID here to join">
        <button id="start-game" class="btn">Enter World</button>
    </div>

    <audio id="peer-audio" autoplay></audio>
    <script>
                /* --- 1. HIGH-GRAPHICS SCENE & LIGHTING --- */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.6);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.0);
        sunLight.position.set(30, 50, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        // Ground & Road
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x2e3842, roughness: 0.9 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const road = new THREE.Mesh(new THREE.PlaneGeometry(18, 300), new THREE.MeshStandardMaterial({ color: 0x181e24, roughness: 0.7 }));
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.02;
        road.receiveShadow = true;
        scene.add(road);

        // City Skyscrapers
        function createCity() {
            const bMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.1, roughness: 0.6 });
            for(let x = -80; x <= 80; x += 35) {
                if(Math.abs(x) < 20) continue;
                for(let z = -90; z <= 90; z += 40) {
                    const h = 18 + Math.random() * 30;
                    const b = new THREE.Mesh(new THREE.BoxGeometry(18, h, 20), bMat);
                    b.position.set(x, h/2, z);
                    b.castShadow = true;
                    b.receiveShadow = true;
                    scene.add(b);
                }
            }
        }
        createCity();

        // Vehicles: Sports Car & Public Bus
        function makeCar() {
            const car = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.2, 5), new THREE.MeshStandardMaterial({ color: 0xdc2626, metalness: 0.5, roughness: 0.3 }));
            body.position.y = 0.8;
            body.castShadow = true;
            car.add(body);
            car.position.set(4, 0, 8);
            scene.add(car);
            return car;
        }

        function makeBus() {
            const bus = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(4, 3.5, 12), new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.5 }));
            body.position.y = 1.9;
            body.castShadow = true;
            bus.add(body);
            bus.position.set(-5, 0, -20);
            scene.add(bus);
            return bus;
        }

        const worldCar = makeCar();
        const worldBus = makeBus();
                /* --- 2. 3D CHARACTER FACTORY & ANIMATIONS --- */
        function buildAvatar(colorHex) {
            const avatar = new THREE.Group();
            
            // Torso / Shirt
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.4, 1.2, 16), new THREE.MeshStandardMaterial({ color: colorHex }));
            torso.position.y = 1.3;
            torso.castShadow = true;
            avatar.add(torso);

            // Head & Hair
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), new THREE.MeshStandardMaterial({ color: 0xfcd34d }));
            head.position.y = 2.15;
            head.castShadow = true;
            avatar.add(head);

            // Legs (for walking animation)
            const legMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
            const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.85), legMat);
            leftLeg.position.set(-0.22, 0.45, 0);
            avatar.add(leftLeg);

            const rightLeg = leftLeg.clone();
            rightLeg.position.x = 0.22;
            avatar.add(rightLeg);

            // Floating Heart for Kissing
            const heartGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const heart = new THREE.Mesh(heartGeo, new THREE.MeshBasicMaterial({ color: 0xff1493 }));
            heart.position.set(0, 2.7, 0);
            heart.visible = false;
            avatar.add(heart);

            avatar.userData = { leftLeg, rightLeg, heart };
            scene.add(avatar);
            return avatar;
        }

        let myPlayer = null;
        let peerPlayer = null;
        let isDriving = false;
        let isHoldingHands = false;
        let isKissing = false;

        // Desktop Keyboard Controls
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if(e.key.toLowerCase() === 'e') toggleHandHold();
            if(e.key.toLowerCase() === 'k') triggerKiss();
            if(e.key.toLowerCase() === 'f') toggleCar();
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        // Action Triggers
        function toggleHandHold() {
            if(!peerPlayer || !myPlayer) return;
            if(myPlayer.position.distanceTo(peerPlayer.position) < 3.5) {
                isHoldingHands = !isHoldingHands;
                isKissing = false;
                myPlayer.userData.heart.visible = false;
                postChat("System", isHoldingHands ? "🤝 Now walking hand-in-hand!" : "Released hands.");
                sendP2P({ type: 'hand', state: isHoldingHands });
            }
        }

        function triggerKiss() {
            if(!peerPlayer || !myPlayer) return;
            if(myPlayer.position.distanceTo(peerPlayer.position) < 3.5) {
                isKissing = !isKissing;
                myPlayer.userData.heart.visible = isKissing;
                postChat("Romantic", isKissing ? "💋 Sharing a sweet kiss!" : "Kiss ended.");
                sendP2P({ type: 'kiss', state: isKissing });
            }
        }

        function toggleCar() {
            if(!myPlayer) return;
            if(myPlayer.position.distanceTo(worldCar.position) < 4) {
                isDriving = !isDriving;
                myPlayer.visible = !isDriving;
                postChat("Vehicle", isDriving ? "Entered Car. Use W/S/A/D to drive!" : "Exited Car.");
            }
        }

        // Mobile Button Listeners
        document.getElementById('btn-hand').onclick = toggleHandHold;
        document.getElementById('btn-kiss').onclick = triggerKiss;
        document.getElementById('btn-car').onclick = toggleCar;
                /* --- 3. MOVEMENT & INTERACTION LOGIC --- */
        function handleMovement(delta) {
            if(!myPlayer) return;

            if(isDriving) {
                const spd = 20 * delta;
                if(keys['w']) worldCar.translateZ(spd);
                if(keys['s']) worldCar.translateZ(-spd);
                if(keys['a']) worldCar.rotation.y += 2.2 * delta;
                if(keys['d']) worldCar.rotation.y -= 2.2 * delta;
                
                myPlayer.position.copy(worldCar.position);
                camera.position.set(worldCar.position.x, worldCar.position.y + 5, worldCar.position.z - 9);
                camera.lookAt(worldCar.position);
                return;
            }

            const walkSpd = (keys['shift'] ? 9 : 5) * delta;
            let moved = false;

            if(keys['w']) { myPlayer.translateZ(walkSpd); moved = true; }
            if(keys['s']) { myPlayer.translateZ(-walkSpd); moved = true; }
            if(keys['a']) { myPlayer.rotation.y += 2.5 * delta; }
            if(keys['d']) { myPlayer.rotation.y -= 2.5 * delta; }

            // Walk animation
            if(moved) {
                const t = Date.now() * 0.009;
                myPlayer.userData.leftLeg.rotation.x = Math.sin(t) * 0.6;
                myPlayer.userData.rightLeg.rotation.x = -Math.sin(t) * 0.6;
            } else {
                myPlayer.userData.leftLeg.rotation.x = 0;
                myPlayer.userData.rightLeg.rotation.x = 0;
            }

            // Hand hold lock
            if(isHoldingHands && peerPlayer) {
                const offset = new THREE.Vector3(1.1, 0, 0).applyQuaternion(myPlayer.quaternion);
                peerPlayer.position.lerp(myPlayer.position.clone().add(offset), 0.15);
                peerPlayer.rotation.y = myPlayer.rotation.y;
            }

            // Kiss pose lock
            if(isKissing && peerPlayer) {
                const frontOffset = new THREE.Vector3(0, 0, 0.9).applyQuaternion(myPlayer.quaternion);
                peerPlayer.position.lerp(myPlayer.position.clone().add(frontOffset), 0.15);
                peerPlayer.lookAt(myPlayer.position);
            }

            // Camera follow
            const camTarget = myPlayer.position.clone().add(new THREE.Vector3(0, 3.5, -6.5).applyQuaternion(myPlayer.quaternion));
            camera.position.lerp(camTarget, 0.1);
            camera.lookAt(myPlayer.position.x, myPlayer.position.y + 1.5, myPlayer.position.z);

            // Proximity HUD
            if(peerPlayer) {
                const near = myPlayer.position.distanceTo(peerPlayer.position) < 3.5;
                document.getElementById('action-banner').style.display = near ? 'block' : 'none';
            }
        }

        /* --- 4. PEERJS (MULTIPLAYER, CHAT & VOICE) --- */
        let peer = null;
        let dataConn = null;
        let myMicStream = null;

        document.getElementById('start-game').onclick = () => {
            const color = document.getElementById('char-color').value;
            const targetId = document.getElementById('partner-id').value.trim();
            document.getElementById('lobby').style.display = 'none';

            myPlayer = buildAvatar(color);

            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = id;
                if(targetId) {
                    dataConn = peer.connect(targetId);
                    bindDataEvents();
                }
            });

            peer.on('connection', (conn) => {
                dataConn = conn;
                bindDataEvents();
            });

            peer.on('call', (call) => {
                navigator.mediaDevices.getUserMedia({ audio: true }).then((st) => {
                    call.answer(st);
                    call.on('stream', (rSt) => { document.getElementById('peer-audio').srcObject = rSt; });
                });
            });
        };

        function bindDataEvents() {
            dataConn.on('open', () => {
                document.getElementById('room-status').innerText = "Friend Joined!";
                postChat("System", "Partner connected successfully!");
            });
            dataConn.on('data', (d) => {
                if(d.type === 'sync') {
                    if(!peerPlayer) peerPlayer = buildAvatar(0x10b981);
                    peerPlayer.position.set(d.x, d.y, d.z);
                    peerPlayer.rotation.y = d.rotY;
                } else if(d.type === 'hand') {
                    isHoldingHands = d.state;
                    postChat("Interaction", isHoldingHands ? "🤝 Hand holding started!" : "Hands released.");
                } else if(d.type === 'kiss') {
                    isKissing = d.state;
                    if(peerPlayer) peerPlayer.userData.heart.visible = isKissing;
                    postChat("Interaction", isKissing ? "💋 Kiss pose started!" : "Kiss ended.");
                } else if(d.type === 'msg') {
                    postChat("Friend", d.text);
                }
            });
        }

        function sendP2P(data) {
            if(dataConn && dataConn.open) dataConn.send(data);
        }

        // Voice button
        document.getElementById('voice-btn').onclick = async () => {
            try {
                myMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById('voice-btn').style.background = '#22c55e';
                document.getElementById('voice-btn').innerText = '🎤 Voice On';
                if(dataConn && dataConn.peer) {
                    const call = peer.call(dataConn.peer, myMicStream);
                    call.on('stream', (rSt) => { document.getElementById('peer-audio').srcObject = rSt; });
                }
            } catch(e) { alert("Microphone access denied!"); }
        };

        // Chat
        function postChat(usr, txt) {
            const logs = document.getElementById('chat-logs');
            logs.innerHTML += `<div><b>${usr}:</b> ${txt}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }
        document.getElementById('chat-btn').onclick = () => {
            const inp = document.getElementById('chat-msg');
            if(!inp.value.trim()) return;
            postChat("Me", inp.value);
            sendP2P({ type: 'msg', text: inp.value });
            inp.value = '';
        };

        /* --- 5. RENDER LOOP --- */
        let prevTime = performance.now();
        function loop() {
            requestAnimationFrame(loop);
            const now = performance.now();
            const delta = (now - prevTime) / 1000;
            prevTime = now;

            handleMovement(delta);

            if(myPlayer && dataConn && dataConn.open) {
                sendP2P({
                    type: 'sync',
                    x: myPlayer.position.x,
                    y: myPlayer.position.y,
                    z: myPlayer.position.z,
                    rotY: myPlayer.rotation.y
                });
            }

            renderer.render(scene, camera);
        }
        loop();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
